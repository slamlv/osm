services:
  # ------------------------------------------------------------------
  # 1. Service web Django (celui qui sert le site) — reprend ton service
  #    existant "osm" (School Manager / Production / osm)
  # ------------------------------------------------------------------
  - type: web
    name: osm
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py migrate_schemas && python manage.py collectstatic --noinput"
    startCommand: "gunicorn osm.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: osm-redis
          property: connectionString
      - fromGroup: osm-shared-env

  # ------------------------------------------------------------------
  # 2. Service worker Celery (exécute les tâches en arrière-plan)
  # ------------------------------------------------------------------
  - type: worker
    name: osm-celery-worker
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A osm worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: REDIS_URL
        fromService:
          type: redis
          name: osm-redis
          property: connectionString
      - fromGroup: osm-shared-env

  # ------------------------------------------------------------------
  # 3. Instance Redis (broker Celery)
  # ------------------------------------------------------------------
  - type: redis
    name: osm-redis
    plan: free
    region: oregon
    ipAllowList: []   # accès privé uniquement, réservé aux services de ce projet

# ------------------------------------------------------------------
# Groupe de variables partagées entre web et worker.
# Les valeurs "sync: false" sont à remplir dans le dashboard Render
# (Environment Groups), jamais en clair ici.
# ------------------------------------------------------------------
envVarGroups:
  - name: osm-shared-env
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
