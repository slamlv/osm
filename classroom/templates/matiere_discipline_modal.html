<form method="post" hx-post="{% url 'matiere_add_discipline' %}" hx-target="#disciplineModalContent" hx-swap="innerHTML" hx-headers='{"subsystem": "{{ subsystem }}"}'>
    {% csrf_token %}
    <input type="hidden" name="subsystem" value="{{ sub_system }}">
    <div class="modal-header">
        <div class="d-flex align-items-center gap-2"><i class="bi bi-door-open text-info fs-5"></i>
            <h6 class="modal-title text-white fw-bold mb-0">Ajouter une discipline</h6>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
    </div>
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-sm-6"><label class="text-white control-label">Intitulé de la Discipline</label>{{ form.label }}</div>
            <div class="col-sm-6"><label class="text-white">Discipline principale</label>{{ form.matiere }}</div>
            <div class="col-sm-6"><label class="text-white control-label">Domaine d'apprentissage</label>{{ form.groupe }}</div>
            <div class="col-sm-6"><label class="text-white control-label">Sous-Système</label>{{ form.subsystem }}</div>
            <datalist id="mat_list">{% for m in mat %}<option value="{{ m }}">{% endfor %}</datalist>
            <datalist id="group_list">{% for g in gp %}<option value="{{ g }}">{% endfor %}</datalist>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-success fw-semibold" data-with-spinner>
            <i class="bi bi-save me-2"></i>Enregistrer</button>
    </div>
</form>
