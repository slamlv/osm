{% extends "base.html" %}

{% block content %}
<style>
  .form-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .form-card-header { background:linear-gradient(135deg,#152f45,#1e4266); border-bottom:1px solid rgba(255,255,255,0.08); padding:1rem 1.5rem; }
  .form-card input,.form-card select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .form-card input:focus,.form-card select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; color:#fff!important; }
  .form-card label { font-size:0.82rem; margin-bottom:4px; }
</style>
<div class="container py-3" style="max-width:620px;">
  <div class="form-card">
    <div class="form-card-header d-flex align-items-center gap-2">
      <i class="bi bi-journal-plus text-success fs-5"></i>
      <h6 class="text-white fw-bold mb-0">Ajouter une discipline</h6>
    </div>
    <div class="p-3 p-sm-4">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3 mb-4">
          <div class="col-sm-6"><label class="text-white control-label">Intitulé de la Discipline</label>{{ form.label }}</div>
          <div class="col-sm-6"><label class="text-white">Discipline principale</label>{{ form.matiere }}</div>
          <div class="col-sm-6"><label class="text-white control-label">Domaine d'apprentissage</label>{{ form.groupe }}</div>
        </div>
        <datalist id="mat_list">{% for m in mat %}<option value="{{ m }}">{% endfor %}</datalist>
        <datalist id="group_list">{% for g in gp %}<option value="{{ g }}">{% endfor %}</datalist>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
          <button class="btn btn-success fw-semibold" type="submit" data-with-spinner><i class="bi bi-save me-2"></i>Sauvegarder</button>
          <button class="btn btn-outline-danger" type="reset"><i class="bi bi-arrow-counterclockwise me-2"></i>Réinitialiser</button>
          <a class="btn btn-outline-secondary" href="{% url 'subjects' %}"><i class="bi bi-x-circle me-2"></i>Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
