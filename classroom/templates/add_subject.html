{% extends "base.html" %}

{% block content %}
<div class="container w-md 75 w-lg-50 mt-4">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row mt-2">
            <div class="mb-3 col-sm-6">
                <label for="label" class="text-white control-label">Intitulé de la Discipline</label>
                {{ form.label }}
            </div>
            <div class="mb-3 col-sm-6">
                <label for="matiere" class="text-white">Discipline principale</label>
                {{ form.matiere }}
            </div>
            <div class="mb-3 col-sm-6">
                <label for="groupe" class="text-white control-label">Domaine d'apprentissage</label>
                {{ form.groupe }}
            </div>
        </div>
        <datalist id="mat_list">
            {% for m in mat %}
                <option value="{{ m }}">
            {% endfor %}
        </datalist>
        <datalist id="group_list">
            {% for g in gp %}
                <option value="{{ g }}">
            {% endfor %}
        </datalist>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
            <button class="btn btn-success" type="submit" data-with-spinner>
                <i class="bi bi-save me-2 bg-transparent"></i>Sauvegarder</button>
            <button class="btn btn-danger" type="reset">
                <i class="bi bi-arrow-counterclockwise d-none d-sm-inline me-2 bg-transparent"></i>Annuler les changements</button>
            <a class="btn btn-secondary" href="{% url 'subjects' %}">
                <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
