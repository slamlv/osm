{% extends "base.html" %}

{% block content %}
<style>
  .form-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .form-card-header { background:linear-gradient(135deg,#152f45,#1e4266); border-bottom:1px solid rgba(255,255,255,0.08); padding:1rem 1.5rem; }
  .form-card input,.form-card select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .form-card input:focus,.form-card select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; color:#fff!important; }
  .form-card label { font-size:0.82rem; margin-bottom:4px; }
  .matiere-add-form-container {width: 100%; max-width: 800px;}
  @media (min-width: 1200px) {
    .matiere-add-form-container {max-width: 800px;}
  }
</style>
<div class="container py-3 matiere-add-form-container">
  <div class="form-card">
    <div class="form-card-header d-flex align-items-center gap-2">
      <i class="bi bi-book text-warning fs-5"></i>
      <h6 class="text-white fw-bold mb-0">Ajouter une matière</h6>
    </div>
    <div class="p-3 p-sm-4">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3 mb-4" id="classroom_form">
          <div class="col-sm-6"><label class="text-white control-label">Classe</label>{{ matiere_form.classe }}</div>
          <div class="col-sm-6" id="reload"><label class="text-white control-label">Matière</label>{{ matiere_form.discipline }}</div>
          <div class="col-sm-6"><label class="text-white control-label">Coefficient</label>{{ matiere_form.coeff }}</div>
          <div class="col-sm-6 d-flex align-items-end">
            <div class="p-2 rounded-3 w-100" style="background:rgba(255,193,7,0.08);border:1px solid rgba(255,193,7,0.2);">
              <p class="text-white-50 small mb-1">Discipline introuvable ?</p>
              <a hx-get="{% url 'matiere_add_discipline' %}" href="" class="text-warning small fw-semibold" data-bs-toggle="modal"
                 hx-swap="innerHTM" data-bs-target="#disciplineModal" hx-target="#disciplineModalContent" hx-headers='{"subsystem": "{{ subsystem }}"}'>
                  <i class="bi bi-plus-circle me-1"></i>Ajouter une Discipline</a>
            </div>
          </div>
        </div>
        <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
          <button class="btn btn-success fw-semibold" type="submit"><i class="bi bi-save me-2"></i>Sauvegarder</button>
          <a class="btn btn-outline-secondary btn-back" href="{% url 'index' %}"><i class="bi bi-x-circle me-2"></i>Annuler</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="disciplineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content form-card" id="disciplineModalContent">
            <div class="modal-body text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    /**
     * Ajoute une option à un <select> si elle n'existe pas,
     * puis la sélectionne.
     */
    function addAndSelectOption(select, id, label) {
        if (!select || !id) return;
        const value = String(id);
        let option = Array.from(select.options).find(
            option => option.value === value
        );
        if (!option) {
            option = new Option(label, value);
            select.add(option);
        }
        select.value = value;
        // Permet aux éventuels autres scripts de réagir
        // au changement de valeur.
        select.dispatchEvent(
            new Event('change', { bubbles: true })
        );
    }
    /**
     * Ferme proprement la modale Bootstrap contenant le formulaire HTMX.
     * On recherche la modale depuis le formulaire qui vient d'être soumis,
     * ce qui évite de dépendre d'un ID particulier.
     */
    function closeDisciplineModal() {
        const modalElement = document.querySelector(
            '.modal.show'
        );
        if (!modalElement) return;
        const modal = bootstrap.Modal.getOrCreateInstance(
            modalElement
        );
        modal.hide();
    }
    /**
     * Discipline créée avec succès.
     */
    document.body.addEventListener('disciplineCreated', function (event) {
        const data = event.detail || {};
        const select = document.getElementById(
            'discipline'
        );
        addAndSelectOption(
            select,
            data.id,
            data.label
        );
        closeDisciplineModal();
    });
})();
</script>
{% endblock %}
