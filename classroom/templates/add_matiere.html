{% extends "base.html" %}

{% block content %}
    <div class="container w-md-75 w-lg-50">
        <p class="text-white text-center d-none">TODO</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row row-cols-1 mt-2 cblock" id="classroom_form">
                <div class="mb-3 col-sm-6">
                    <label for="classe" class="text-white control-label">Classe</label>
                    {{ matiere_form.classe }}
                </div>
                <div class="mb-3 col-sm-6" id="reload">
                    <label for="discipline" class="text-white control-label">Matière</label>
                    {{ matiere_form.discipline }}
                </div>
                <div class="mb-3 col-sm-6" id="reload">
                    <label for="coeff" class="text-white control-label">Coefficient</label>
                    {{ matiere_form.coeff }}
                </div>
                <div class="mb-3 col-sm-6" id="reload">
                    <p class="text-white mt-3 mb-0">Vous ne trouvez pas la discipline ?</p>
                    <a href="{% url 'subject-add' %}" class="link-warning">Ajouter une Discipline</a>
                </div>
            </div>
            <div class="d-flex mt-2 gap-2 justify-content-center">
                <button class="btn btn-success" type="submit">
                    <i class="bi bi-save me-2 bg-transparent"></i>Sauvegarder</button>
                <!--button class="btn btn-danger" type="reset">
                    <i class="bi bi-arrow-counterclockwise d-none d-sm-inline me-2 bg-transparent"></i>Annuler les changements</button-->
                <a class="btn btn-secondary" href="{% url 'class-subjects' id=id %}">
                    <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
            </div>
        </form>
    </div>
{% endblock %}
