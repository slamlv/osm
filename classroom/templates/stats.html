{% extends "base.html" %}

{% block content %}
<style>
  .form-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .form-card-header { background:linear-gradient(135deg,#152f45,#1e4266); border-bottom:1px solid rgba(255,255,255,0.08); padding:1rem 1.5rem; }
  .form-card input,.form-card select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .form-card input:focus,.form-card select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; color:#fff!important; }
  .form-card label { font-size:0.82rem; margin-bottom:4px; }
</style>

<div class="container py-3" style="max-width:960px;">
  <div class="form-card mb-4" style="max-width:580px;margin-left:auto;margin-right:auto;">
    <div class="form-card-header d-flex align-items-center gap-2">
      <i class="bi bi-bar-chart text-warning fs-5"></i>
      <h6 class="text-white fw-bold mb-0">Statistiques</h6>
    </div>
    <div class="p-3 p-sm-4">
      <form method="post" enctype="multipart/form-data" id="choices" hx-post="{% url 'stats' %}" hx-target="#result">
        {% csrf_token %}
        <div class="row g-3 mb-4">
          <div class="col-sm-6"><label class="text-white control-label">Classe</label>{{ check_form.clsrm }}</div>
          <div class="col-sm-6"><label class="text-white control-label">Trimestre</label>{{ check_form.evl }}</div>
          <div class="col-sm-6"><label class="text-white">Moyenne minimale d'admission</label><input name="seuil" id="seuil" type="number" class="form-control fw-bold" value="10" step="0.01"></div>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn btn-primary fw-semibold px-5" type="submit" hx-include="#choices" data-with-spinner>
            <i class="bi bi-search me-2"></i>Soumettre
          </button>
        </div>
      </form>
    </div>
  </div>
  <div id="result"></div>
</div>
{% endblock %}
