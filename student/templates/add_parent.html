{% extends "base.html" %}

{% block content %}
    <div class="container w-md-75 w-lg-50">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row mt-2" id="classroom_form">
                <div class="mb-3 col-sm-6">
                    <label for="nom" class="text-white control-label">Nom(s)</label>
                    {{ form.nom }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="prenom" class="text-white">Prénom(s)</label>
                    {{ form.prenom }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="civilite" class="text-white control-label">Civilité</label>
                    {{ form.civilite }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="email" class="text-white">Email</label>
                    {{ form.email }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="contact" class="text-white control-label">Contact</label>
                    {{ form.contact }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="profession" class="text-white">Profession</label>
                    {{ form.profession }}
                </div>
            </div>
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <button class="btn btn-success" type="submit" data-with-spinner>
                    <i class="bi bi-save me-2 bg-transparent"></i>Sauvegarder</button>
                <button class="btn btn-danger" type="reset">
                    <i class="bi bi-arrow-counterclockwise me-2 bg-transparent"></i>{{ reset }}</button>
                <a class="btn btn-secondary" href="{% url 'parents' %}">
                    <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
            </div>
        </form>
    </div>
{% endblock %}
