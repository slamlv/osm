<style>
  #import-form input[type=file] { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .rapport-item { display:flex; align-items:flex-start; gap:8px; padding:5px 0; font-size:0.85rem; border-bottom:1px solid rgba(255,255,255,0.05); }
  .rapport-item:last-child { border-bottom:none; }
</style>

<form method="post" enctype="multipart/form-data" id="import-form"
      hx-post="{% url 'students_import' %}" hx-target="#import-form" hx-swap="outerHTML">
  {% csrf_token %}

  <div class="alert alert-info py-2 small rounded-3 mb-3">
    <i class="bi bi-info-circle me-2"></i>
    Formats : <strong>.xls, .xlsx, .ods</strong> — Champs obligatoires : matricule, noms, prénoms, date et lieu de naissance, sexe.
  </div>

  <div class="mb-3">
    <label class="text-white control-label" style="font-size:0.82rem;margin-bottom:4px;display:block;">Fichier Excel ou LibreOffice</label>
    <input class="form-control" type="file" id="file" name="file" accept=".xls,.xlsx,.ods">
  </div>

  <div class="d-flex justify-content-center mb-3">
    <button class="btn btn-success fw-semibold px-5" type="submit"
            data-bs-toggle="tooltip" title="Fichier Excel ou LibreOffice">
      <i class="bi bi-upload me-2"></i>Importer
    </button>
  </div>

  {% if rapport %}
  <div class="alert alert-warning py-2 small rounded-3 mt-3">
    <p class="fw-bold mb-2"><i class="bi bi-clipboard-check me-2"></i>Rapport d'importation</p>
    {% for elt in rapport %}
    <div class="rapport-item">
      <span class="{% if elt.0 %}text-success{% else %}text-danger{% endif %} fw-bold flex-shrink-0">{% if elt.0 %}✔{% else %}✘{% endif %}</span>
      <span class="{% if elt.0 %}text-white{% else %}text-danger{% endif %}">{{ elt.1 }}</span>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  <div id="error-zone" class="alert alert-info d-none mt-3 py-2 small rounded-3"></div>
</form>
