<style>
  .disc-fieldset { border:1px solid rgba(23,162,184,0.35); border-radius:16px; padding:1.25rem; }
  .disc-fieldset legend { font-size:0.9rem; font-weight:700; color:#ffc107; padding:0 8px; width:auto; }
  .disc-fieldset label { font-size:0.82rem; margin-bottom:4px; color:rgba(255,255,255,0.75); display:block; }
  .disc-fieldset input,.disc-fieldset select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .disc-fieldset input:focus,.disc-fieldset select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; }
</style>

{% if show %}
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <fieldset class="disc-fieldset">
    <legend>{{ std_info }}</legend>
    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-4">
        <label>Absences (heures)</label>{{ form.abs }}
      </div>
      <div class="col-6 col-lg-4">
        <label>Absences justifiées (h)</label>{{ form.absj }}
      </div>
      <div class="col-6 col-lg-4">
        <label>Retards</label>{{ form.retards }}
      </div>
      <div class="col-6 col-lg-4">
        <label>Consignes (heures)</label>{{ form.cons }}
      </div>
      <div class="col-6 col-lg-4">
        <label>Exclusion définitive</label>{{ form.excl_def }}
      </div>
    </div>
    <div class="d-flex justify-content-center">
      <a class="btn btn-success fw-semibold px-5" type="submit"
         hx-post="{% url 'discipline-edit' id=sid trim=trim %}"
         hx-target="#edit" data-with-spinner>
        <i class="bi bi-save me-2"></i>Enregistrer
      </a>
    </div>
  </fieldset>
</form>

{% else %}
<script>
  (function () {
    var modalEl = document.getElementById('disciplineModal');
    if (modalEl) {
      var inst = bootstrap.Modal.getInstance(modalEl);
      if (inst) inst.hide();
    }
  })();
</script>
{% endif %}
