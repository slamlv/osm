<form method="post" hx-post="{% url 'student-add-parent' %}" hx-target="#studentRelatedModalContent" hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-header">
        <div class="d-flex align-items-center gap-2"><i class="bi bi-person-badge text-success fs-5"></i>
            <h6 class="modal-title text-white fw-bold mb-0">Ajouter un parent</h6>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fermer"></button>
    </div>
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-12 col-lg-6"><label class="text-white control-label">Nom(s)</label>{{ form.nom }}</div>
            <div class="col-12 col-lg-6"><label class="text-white">Prénom(s)</label>{{ form.prenom }}</div>
            <div class="col-12 col-lg-6"><label class="text-white control-label">Civilité</label>{{ form.civilite }}</div>
            <div class="col-12 col-lg-6"><label class="text-white">Email</label>{{ form.courriel }}</div>
            <div class="col-12 col-lg-6"><label class="text-white control-label">Contact</label>{{ form.contact }}</div>
            <div class="col-12 col-lg-6"><label class="text-white">Profession</label>{{ form.profession }}</div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="submit" class="btn btn-success fw-semibold" data-with-spinner>
            <i class="bi bi-save me-2"></i>Enregistrer</button>
    </div>
</form>
