{% extends "base.html" %}

{% block content %}
<style>
  .confirm-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,193,7,0.2); border-radius:20px; max-width:480px; }
</style>

<div class="d-flex justify-content-center align-items-start py-4 px-3">
  <div class="confirm-card p-4 p-sm-5 text-center">
    <div class="mb-3" style="font-size:3rem;line-height:1;">🗑️</div>
    <h5 class="text-warning fw-bold mb-3">Confirmer la suppression</h5>
    <p class="text-white-50 small mb-1">
      Êtes-vous sûr de vouloir supprimer
      <strong class="text-white">{{ info }}</strong> {{ alerte }}
    </p>
    {% if nb %}<p class="text-danger small fw-semibold mb-3">{{ nb }}</p>{% endif %}
    <p class="text-warning small mb-1">NB : CETTE ACTION EST IRRÉVERSIBLE, VOUS PERDREZ DÉFINITIVEMENT SES DONNÉES</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <input type="hidden" name="back" value="{{ back }}">
      <div class="d-flex gap-2 justify-content-center mt-3">
        <button class="btn btn-danger fw-semibold" type="submit" data-with-spinner>
          <i class="bi bi-trash me-2"></i>Supprimer
        </button>
        <a class="btn btn-outline-secondary btn-back" href="{% url 'index' %}">
          <i class="bi bi-x-circle me-2"></i>Annuler
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
