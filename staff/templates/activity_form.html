{% extends "base.html" %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="container w-md-75 w-lg-50">
            <div class="row">
                <div class="mb-3 required col-sm-6">
                    <label for="nom" class="control-label text-white">Du</label>
                    {{ form.start }}
                </div>
                <div class="mb-3 col-sm-6">
                    <label for="prenom" class="text-white">Au</label>
                    {{ form.end }}
                </div>
                <div class="mb-3 required col-sm-6">
                    <label for="civilite" class="control-label text-white">Activité</label>
                    {{ form.label }}
                </div>
                <div class="mb-3 required col-sm-6">
                    <label for="poste" class="control-label text-white">Intervenants</label>
                    {{ form.responsables }}
                </div>
                <div class="d-flex flex-column flex-sm-row cblock gap-2 justify-content-center">
                    <button class="btn btn-success" type="submit" data-with-spinner>
                        <i class="bi bi-save me-2 bg-transparent"></i>Sauvegarder</button>
                    <button class="btn btn-danger" type="reset">
                        <i class="bi bi-arrow-counterclockwise me-2 bg-transparent"></i>{{ reset }}</button>
                    <a class="btn btn-secondary" href="{{ back }}">
                        <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
                </div>
            </div>
        </div>
    </form>
{% endblock %}
