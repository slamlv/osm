{% extends "base.html" %}

{% block content %}
<style>
  .form-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .form-card-header { background:linear-gradient(135deg,#152f45,#1e4266); border-bottom:1px solid rgba(255,255,255,0.08); padding:1rem 1.5rem; }
  .form-card input,.form-card select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .form-card input:focus,.form-card select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; color:#fff!important; }
  .form-card label { font-size:0.82rem; margin-bottom:4px; }
  .copy-fieldset { border:1px solid rgba(23,162,184,0.35); border-radius:14px; padding:1rem 1.25rem; }
  .copy-fieldset legend { font-size:0.85rem; font-weight:700; color:#ffc107; padding:0 8px; width:auto; }
</style>

<div class="container py-3" style="max-width:720px;">
  {% if not rapport %}
  <div class="alert alert-warning py-2 small rounded-3 mb-3">
    <i class="bi bi-exclamation-triangle me-2"></i>Si des notes existaient déjà à la destination, elles seront <strong>perdues</strong>.
  </div>
  <div class="form-card">
    <div class="form-card-header d-flex align-items-center gap-2">
      <i class="bi bi-arrow-repeat text-info fs-5"></i>
      <h6 class="text-white fw-bold mb-0">Reconduction des notes</h6>
    </div>
    <div class="p-3 p-sm-4">
      <form method="post" enctype="multipart/form-data" id="copy_form">
        {% csrf_token %}
        <div class="row g-3 mb-4" id="marks_copy_form">
          {% include 'marks_copy_to_and_from.html' %}
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn btn-success fw-semibold px-5" type="submit">
            <i class="bi bi-repeat me-2"></i>Reconduire les Notes
          </button>
        </div>
      </form>
    </div>
  </div>
  {% else %}
  <div class="alert alert-warning py-2 small rounded-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
    <span>{{ rapport }}</span>
    <a class="btn btn-success btn-sm fw-semibold" href="{% url 'set_periods' %}">
      <i class="bi bi-gear me-1"></i>Éditer les périodes
    </a>
  </div>
  {% endif %}
</div>
{% endblock %}
