{% extends "base.html" %}

{% block content %}
<div class="container w-md-75 mt-4">
{% if msg %}
    <div class="alert alert-info mt-3 py-2 fade show alert-dismissible" role="alert">
        <button type="button" class="btn-close position absolute" data-bs-dismiss="alert" aria-label="Close"></button>
        <p class="bg-transparent mb-0 ctext">{{ msg }}</p>
    </div>
{% else %}
    {% if not trim %}
    <form method="post" enctype="multipart/form-data" id="select" hx-get="{% url 'level-marks-edit' %}" hx-target="#marks_form">
    {% else %}
    <form method="post" enctype="multipart/form-data" id="select" hx-get="{% url 'tlevel-marks-edit' %}" hx-target="#marks_form">
    {% endif %}
    {% csrf_token %}
    <div class="row row-cols-1 mt-2 w-lg-75 cblock" id="classroom_form">
        <div class="mb-3 col-sm-4">
            <label for="matiere" class="text-white control-label">Niveau</label>
            {{ select_form.matiere_level }}
        </div>
        <div class="mb-3 col-sm-4" id="classrooms">
            <label for="classe" class="text-white control-label">Niveau</label>
            {{ select_form.classroom }}
        </div>
        <div class="mb-3 col-sm-4">
            <label for="eval" class="text-white control-label">{% if trim %} Trimestre {% else %} Évaluation {% endif %}</label>
            {{ select_form.eval }}
        </div>
    </div>
    <div class="d-flex justify-content-center">
        <button class="btn btn-primary" type="submit" data-with-spinner hx-include="#select">
            <i class="bi bi-save me-2 bg-transparent"></i>Soumettre</button>
    </div>
    </form>
    <form method="post" enctype="multipart/form-data" id="marks_form"></form>
{% endif %}
</div>
{% endblock %}
