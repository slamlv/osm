{% extends "base.html" %}

{% block content %}
<style>
  .form-card { background:linear-gradient(145deg,#1b3a57,#172e45); border:1px solid rgba(255,255,255,0.08); border-radius:20px; overflow:hidden; }
  .form-card-header { background:linear-gradient(135deg,#152f45,#1e4266); border-bottom:1px solid rgba(255,255,255,0.08); padding:1rem 1.5rem; }
  .form-card input,.form-card select { background-color:rgba(255,255,255,0.07)!important; border:1px solid rgba(255,255,255,0.15)!important; color:#fff!important; border-radius:10px!important; }
  .form-card input:focus,.form-card select:focus { background-color:rgba(255,255,255,0.11)!important; border-color:#0d6efd!important; box-shadow:0 0 0 3px rgba(13,110,253,0.2)!important; color:#fff!important; }
  .form-card label { font-size:0.82rem; margin-bottom:4px; }
</style>

<div class="container py-3" style="max-width:900px;">
{% if msg %}
  <div class="alert alert-info py-2 small rounded-3 d-flex align-items-center justify-content-between">
    <span>{{ msg }}</span>
    <button type="button" class="btn-close btn-close-white btn-sm" data-bs-dismiss="alert"></button>
  </div>
{% else %}
  <div class="form-card mb-4" style="max-width:620px;margin-left:auto;margin-right:auto;">
    <div class="form-card-header d-flex align-items-center gap-2">
      <i class="bi bi-pencil-square text-primary fs-5"></i>
      <h6 class="text-white fw-bold mb-0">Sélection — par niveau</h6>
    </div>
    <div class="p-3 p-sm-4">
      {% if not trim %}
      <form method="post" enctype="multipart/form-data" id="select" hx-get="{% url 'level-marks-edit' %}" hx-target="#marks_form">
      {% else %}
      <form method="post" enctype="multipart/form-data" id="select" hx-get="{% url 'tlevel-marks-edit' %}" hx-target="#marks_form">
      {% endif %}
        {% csrf_token %}
        <div class="row g-3 mb-4" id="classroom_form">
          <div class="col-sm-4"><label class="text-white control-label">Niveau</label>{{ select_form.matiere_level }}</div>
          <div class="col-sm-4" id="classrooms"><label class="text-white control-label">Classe</label>{{ select_form.classroom }}</div>
          <div class="col-sm-4"><label class="text-white control-label">{% if trim %}Trimestre{% else %}Évaluation{% endif %}</label>{{ select_form.eval }}</div>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn btn-primary fw-semibold px-5" type="submit" data-with-spinner hx-include="#select">
            <i class="bi bi-send me-2"></i>Soumettre
          </button>
        </div>
      </form>
    </div>
  </div>
  <form method="post" enctype="multipart/form-data" id="marks_form"></form>
{% endif %}
</div>
{% endblock %}
