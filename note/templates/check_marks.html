{% extends "base.html" %}

{% block content %}
<div class="container w-md-75">
    <form method="post" enctype="multipart/form-data" id="choices" hx-post="{% url 'check' %}" hx-target="#result">
        {% csrf_token %}
        <div class="row row-cols-1 mt-2 w-md-75 cblock" id="classroom_form">
            <div class="mb-3 col-sm-6">
                <label for="classe" class="text-white control-label">Classe</label>
                {{ check_form.clsrm }}
            </div>
            <div class="mb-3 col-sm-6">
                <label for="eval" class="text-white control-label">Évaluation</label>
                {{ check_form.evl }}
                </div>
        </div>
        <div class="d-flex justify-content-center">
            <button class="btn btn-success" type="submit" hx-include="#choices" data-with-spinner>
                <i class="bi bi-save me-2 bg-transparent"></i>Soumettre</button>
        </div>
    </form>
    <div id="result" class="mt-3"></div>
</div>
{% endblock %}
