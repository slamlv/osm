{% extends "base.html" %}

{% block content %}
<div class="container w-md-75 w-lg-50">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row mt-2" id="period_form">
            {% include 'period_form.html' %}
        </div>
        <div class="d-flex mt-2 mb-3 gap-2 justify-content-center">
            <button class="btn btn-success" type="submit">
                <i class="bi bi-save me-2 bg-transparent"></i>Enregistrer</button>
        </div>
        <table class="table table-striped table-hover">
            <thead class="table-light">
            <tr>
                <th class="align-middle">Evaluation</th>
                <th class="align-middle">À partir du</th>
                <th class="align-middle">Jusqu'au</th>
            </tr>
            </thead>
            <tbody>
            {% for period in periods %}
            <tr class="table-dark border-primary">
                <td class="align-middle">Évaluation n° {{ period.evalx }}</td>
                <td class="align-middle">{{ period.debut }}</td>
                <td class="align-middle">{{ period.fin }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </form>
</div>
{% endblock %}
