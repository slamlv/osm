<style>
  .osm-table-outer { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid rgba(255,255,255,0.08); border-radius:14px; }
  .osm-table-outer table { margin-bottom:0; min-width:380px; }
  .osm-table-outer thead tr { background:linear-gradient(135deg,#152f45,#1a3a57); }
  .osm-table-outer thead th { color:rgba(255,255,255,0.65)!important; background:transparent!important; font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; border-color:rgba(255,255,255,0.1)!important; padding:10px 12px; white-space:nowrap; }
  .osm-table-outer tbody tr { background-color:#1b3a57!important; border-color:rgba(255,255,255,0.06)!important; transition:background 0.12s; }
  .osm-table-outer tbody tr:hover { background-color:#1f4266!important; }
  .osm-table-outer tbody td { color:rgba(255,255,255,0.85)!important; background:transparent!important; font-size:0.86rem; border-color:rgba(255,255,255,0.06)!important; padding:10px 12px; vertical-align:middle; }
</style>

<div class="alert alert-info py-2 small rounded-3 mt-3">
  <i class="bi bi-info-circle me-2"></i>{{ info }}
</div>

<div class="osm-table-outer mt-2">
  <table class="table table-hover align-middle text-nowrap">
    <thead><tr>
      <th style="width:36px;">#</th>
      <th>Matière</th>
      <th>Rapporteur</th>
      <th>Éval{{ eval.0 }}</th>
      <th>Éval{{ eval.1 }}</th>
    </tr></thead>
    <tbody>
      {% for elt in result %}
      <tr>
        <td style="color:rgba(255,255,255,0.3);font-size:0.78rem;">{{ forloop.counter }}</td>
        <td class="fw-semibold">{{ elt.matiere }}</td>
        <td>
          <span class="d-none d-lg-inline">{{ elt.rapporteur }}</span>
          <span class="d-lg-none">{{ elt.rapporteur.short_name }}</span>
        </td>
        <td class="fs-5 text-center">{% if elt.status %}✅{% else %}❌{% endif %}</td>
        <td class="fs-5 text-center">{% if elt.status1 %}✅{% else %}❌{% endif %}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
