{% extends base_template %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="container w-md-75 w-lg-50">
            {% if form.old_mdp %}
            <div class="mb-3">
                <label for="old_mdp" class="text-white">Mot de passe actuel</label>
                {{ form.old_mdp }}
            </div>
            {% endif %}
            <div class="mb-3">
                <label for="mdp" class="text-white">Nouveau mot de passe</label>
                {{ form.mdp }}
            </div>
            <div class="mb-3">
                <label for="mdp_confirm" class="text-white">Confirmation du mot de passe</label>
                {{ form.mdp_confirm }}
            </div>
        </div>
        <div class="d-flex justify-content-center gap-1 gap-md-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-save me-2 bg-transparent"></i>Sauvegarder</button>
            {% if is_auth %}
            <a class="btn btn-secondary" href="{% url 'user-details' %}">
                <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
            {% else %}
            <a class="btn btn-secondary" href="{% url 'signin' %}">
                <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
            {% endif %}
        </div>
    </form>
{% endblock %}
