{% extends "unauthenticated_base.html" %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="container w-md-75 w-lg-50">
            <div class="mb-3">
                <label for="username" class="text-white">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="mdp" class="text-white">Mot de passe</label>
                {{ form.mdp }}
            </div>
        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 px-2 px-sm-0">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-box-arrow-in-right me-2 bg-transparent"></i>Se connecter</button>
            <a class="btn btn-danger" href="{% url 'code' %}">
                <i class="bi bi-person-plus me-2 bg-transparent"></i>Je n'ai pas de compte</a>
            <a class="btn btn-warning" href="{% url 'reset' %}">
                <i class="bi bi-key me-2 bg-transparent"></i>Mot de passe oublié</a>
        </div>
    </form>
{% endblock %}
