{% extends "unauthenticated_base.html" %}

{% block content %}
<style>
  .auth-card {
    background: linear-gradient(145deg, #1b3a57, #172e45);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
    width: 100%;
    max-width: 420px;
  }
  .auth-card-header {
    background: linear-gradient(135deg, #152f45, #1e4266);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 1.25rem 1.5rem;
    text-align: center;
  }
  .auth-card-body { padding: 1.5rem; }
  .auth-card label { font-size: 0.82rem; margin-bottom: 4px; color: rgba(255,255,255,0.75); }
  .auth-card input {
    background-color: rgba(255,255,255,0.07) !important;
    border: 1px solid rgba(255,255,255,0.15) !important;
    color: #fff !important;
    border-radius: 10px !important;
  }
  .auth-card input:focus {
    background-color: rgba(255,255,255,0.11) !important;
    border-color: #0d6efd !important;
    box-shadow: 0 0 0 3px rgba(13,110,253,0.2) !important;
    color: #fff !important;
  }
  .auth-card input::placeholder { color: rgba(255,255,255,0.25) !important; }
</style>

<div class="d-flex justify-content-center align-items-start py-4 px-3">
  <div class="auth-card">

    <div class="auth-card-header">
      <i class="bi bi-key fs-3 text-warning mb-2 d-block"></i>
      <h6 class="text-white fw-bold mb-0">Réinitialisation</h6>
      <p class="text-white-50 small mb-0">Mot de passe oublié</p>
    </div>

    <div class="auth-card-body">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          <label>Nom d'utilisateur</label>
          {{ form.username }}
        </div>
        <div class="mb-4">
          <label>Adresse électronique</label>
          {{ form.email }}
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary fw-semibold flex-grow-1" type="submit">
            <i class="bi bi-send me-2"></i>Soumettre
          </button>
          <a class="btn btn-outline-secondary" href="{% url 'signin' %}">
            <i class="bi bi-x-circle me-2"></i>Annuler
          </a>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
