{% extends "unauthenticated_base.html" %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="container w-md-75 w-lg-50">
            <div class="mb-3">
                <label for="username" class="text-white">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="mdp" class="text-white">Adresse électronique</label>
                {{ form.email }}
            </div>
        </div>
        <div class="d-flex justify-content-center gap-1 gap-md-2">
            <button class="btn btn-primary" type="submit">
                <i class="bi bi-box-arrow-in-right me-2 bg-transparent"></i>Soumettre</button>
            <a class="btn btn-secondary" href="{% url 'signin' %}">
                <i class="bi bi-x-circle me-2 bg-transparent"></i>Annuler</a>
        </div>
    </form>
{% endblock %}
